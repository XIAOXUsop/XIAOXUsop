      <text x="243" y="96" text-anchor="middle" fill="#77b7ff" font-size="9">02</text>
      <text x="243" y="113" text-anchor="middle" fill="#e6edf3">JAVA BACKEND</text>

      <path d="M314 100H343" stroke="#4a9eff" stroke-width="2"/>
      <path d="M338 95L345 100L338 105" fill="none" stroke="#4a9eff" stroke-width="2"/>

      <rect x="352" y="76" width="112" height="48" rx="9" fill="#14263a" stroke="#4a9eff"/>
      <text x="408" y="96" text-anchor="middle" fill="#77b7ff" font-size="9">03</text>
      <text x="408" y="113" text-anchor="middle" fill="#e6edf3">AGENT / RAG</text>
    </g>

    <path d="M408 130V154H243V168" fill="none" stroke="#52667d" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M238 161L243 169L248 161" fill="none" stroke="#c9a961" stroke-width="2"/>

    <rect x="121" y="173" width="244" height="50" rx="10" fill="#28251b" stroke="#c9a961"/>
    <circle cx="145" cy="198" r="7" fill="#c9a961" filter="url(#glow)"/>
    <path d="M142 198l2 2 4-5" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="164" y="194" fill="#e3d38d" font-size="9">04 · VERIFIED OUTPUT</text>
    <text x="164" y="210" fill="#f0e5b5" font-size="12" font-weight="700">EVIDENCE + GUARDRAILS</text>

    <g font-size="9" letter-spacing="1">
      <text x="29" y="250" fill="#7d8da1">EVAL</text><circle cx="67" cy="247" r="3" fill="#56d364"/>
      <text x="102" y="250" fill="#7d8da1">TRACE</text><circle cx="149" cy="247" r="3" fill="#56d364"/>
      <text x="184" y="250" fill="#7d8da1">RECOVERY</text><circle cx="251" cy="247" r="3" fill="#56d364"/>
      <text x="286" y="250" fill="#7d8da1">OBSERVABILITY</text><circle cx="390" cy="247" r="3" fill="#56d364"/>
