<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">XIAOXUsop — Java Backend, AI Applications, Agent Engineering</title>
  <desc id="desc">A dark technical blueprint showing a reliable agent system from input through Java backend and agent processing to evidence and guardrails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.58" stop-color="#101923"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#77b7ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#243244" stroke-width="1" opacity=".42"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <path d="M0 292C240 250 348 340 585 292S944 246 1280 300V360H0Z" fill="#4a9eff" opacity=".045"/>
  <rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="#303d4f"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="68" y="62" fill="#c9a961" font-size="14" font-weight="700" letter-spacing="2.1">RELIABLE SYSTEMS · OPEN TO OPPORTUNITIES</text>
    <text x="66" y="132" fill="#f0f6fc" font-size="60" font-weight="760" letter-spacing="-1.5">XIAOXUsop</text>
    <rect x="68" y="151" width="84" height="4" rx="2" fill="url(#accent)"/>
    <text x="68" y="194" fill="#c9d1d9" font-size="23" font-weight="600">Java Backend · AI Applications · Agent Engineering</text>
    <text x="68" y="231" fill="#8b9aad" font-size="17">Build systems that are evaluable, traceable, recoverable, and observable.</text>

    <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="13" font-weight="600">
      <rect x="68" y="263" width="104" height="34" rx="8" fill="#17283b" stroke="#315d89"/>
      <text x="86" y="285" fill="#77b7ff">JAVA 21</text>
      <rect x="184" y="263" width="142" height="34" rx="8" fill="#17283b" stroke="#315d89"/>
      <text x="201" y="285" fill="#77b7ff">SPRING BOOT</text>
      <rect x="338" y="263" width="136" height="34" rx="8" fill="#27251d" stroke="#776b3d"/>
      <text x="355" y="285" fill="#d8c47b">LANGCHAIN4J</text>
    </g>
  </g>

  <g transform="translate(720 48)" font-family="Consolas, 'SFMono-Regular', monospace">
    <rect width="492" height="264" rx="16" fill="#0b1119" fill-opacity=".82" stroke="#34445a"/>
    <circle cx="23" cy="22" r="4" fill="#ff7b72"/>
    <circle cx="38" cy="22" r="4" fill="#d8b65c"/>
    <circle cx="53" cy="22" r="4" fill="#56d364"/>
