    <line x1="0" y1="42" x2="492" y2="42" stroke="#263445"/>

    <g font-size="12" font-weight="700">
      <rect x="28" y="76" width="106" height="48" rx="9" fill="#131e2b" stroke="#3f6388"/>
      <text x="81" y="96" text-anchor="middle" fill="#8b9aad" font-size="9">01</text>
      <text x="81" y="113" text-anchor="middle" fill="#c9d1d9">EVENT</text>

      <path d="M142 100H171" stroke="#4a9eff" stroke-width="2"/>
      <path d="M166 95L173 100L166 105" fill="none" stroke="#4a9eff" stroke-width="2"/>

